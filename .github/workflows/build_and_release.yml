name: Build & Release

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: MerzoukeMansouri/rust-github-reusable/.github/workflows/ci.yml@main

  release:
    needs: ci
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: MerzoukeMansouri/rust-github-reusable/.github/workflows/release.yml@main
    with:
      binary_name: cua
      repo: MerzoukeMansouri/cu-agent
      formula_class: Cua
      formula_desc: "Drive a real Chrome browser via CDP from the CLI"
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
