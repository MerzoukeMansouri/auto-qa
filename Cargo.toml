[package]
name = "auto-qa"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "autoqa"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
axum = "0.7"
rust-embed = "8"
mime_guess = "2"
