[package]
name = "cu-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cua"
path = "src/main.rs"

[dependencies]
chromiumoxide = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
